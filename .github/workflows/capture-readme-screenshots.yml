name: Capture Bespoke Ops README screenshots

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, run, and capture Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            cd android
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon
            cd ..

            mkdir -p docs/assets
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.bespoke.realops
            adb shell am start -n com.bespoke.realops/.MainActivity
            sleep 3

            cat > /tmp/tap_node.py <<'PY'
            import re, subprocess, sys, time, xml.etree.ElementTree as ET

            target = sys.argv[1]
            for _ in range(24):
                subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                subprocess.run(["adb", "pull", "/sdcard/window.xml", "/tmp/window.xml"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                try:
                    root = ET.parse('/tmp/window.xml').getroot()
                except Exception:
                    time.sleep(0.5)
                    continue
                for node in root.iter('node'):
                    if node.attrib.get('text') == target:
                        m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib['bounds'])
                        if m:
                            x1, y1, x2, y2 = map(int, m.groups())
                            subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
                            time.sleep(1.2)
                            sys.exit(0)
                time.sleep(0.5)
            print(f'Could not find text node: {target}', file=sys.stderr)
            sys.exit(1)
            PY

            adb exec-out screencap -p > docs/assets/command.png

            python /tmp/tap_node.py "Intake"
            adb exec-out screencap -p > docs/assets/intake.png

            python /tmp/tap_node.py "AI Studio"
            adb exec-out screencap -p > docs/assets/ai-studio.png

            python /tmp/tap_node.py "Listings"
            adb exec-out screencap -p > docs/assets/listings.png

            python /tmp/tap_node.py "Automation"
            adb exec-out screencap -p > docs/assets/automation.png

            file docs/assets/*.png

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "Add real Bespoke Ops Android screenshots"
          PUSH_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${PUSH_BRANCH}"
